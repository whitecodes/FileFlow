name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - run: CGO_ENABLED=0 go build -o FileFlow .
      - uses: actions/upload-artifact@v4
        with:
          name: FileFlow
          path: FileFlow
